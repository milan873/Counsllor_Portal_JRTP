<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Bootstrap Website</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>



	<div class="container">
			<ul class="nav">
				<li class="nav-item"><a class="nav-link" href="dashboard">View Dashboard</a></li>
				<li class="nav-item"><a class="nav-link" href="enquiry">Add Enquiry</a></li>
				<li class="nav-item"><a class="nav-link" href="view-enquries">View
						Enquries</a></li>
				<li class="nav-item"><a class="nav-link" href="logout">logout</a></li>

			</ul>
		
		<hr/>
		
		<h1>Dashboard Page</h1>
		
		

		<table>

			<tr>
				<td>Total Enquries:</td>
				<td th:text="${dashboardInfo.totalEnqs}"></td>
			</tr>

			<tr>
				<td>Open Enquries:</td>
				<td th:text="${dashboardInfo.openEnqs}"></td>
			</tr>

			<tr>
				<td>Enrolled Enquries:</td>
				<td th:text="${dashboardInfo.enrolledEnqs}"></td>
			</tr>
			<tr>
				<td>Lost Enquries:</td>
				<td th:text="${dashboardInfo.lostEnqs}"></td>
			</tr>

		</table>

	</div>






	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
