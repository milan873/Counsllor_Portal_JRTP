
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bootstrap Website</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
       <div class="container">
       
        	<h1>Login Here</h1>
        	
        	<font style="color: red;">
        		<p th:text="${emsg}"></p>
        	</font>
        	
        	<form th:action="@{/login}" th:object="${counsellor}"  method="post">
        		
        			<table>
        				<tr>
        					<td>Email : </td>
        					<td><input type="email" th:field="*{email}" class="form-control" requierd/></td>
        				</tr>
        				<tr>
        					<td>Password : </td>
        					<td><input type="password" th:field="*{pwd}" class="form-control" required/></td>
        				</tr>
        				<tr>
        					<td></td>
        					<td><input type="submit" value="Login" class="btn btn-primary"/></td>
        				</tr>
        			</table>
        			
        	</form>
      
        <a href="register">Click Here To Register</a>
       
       </div>
   
    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
